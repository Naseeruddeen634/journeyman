<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b95a3"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc857"/></marker>
</defs>
<rect width="1200" height="680" fill="#0d0f12"/>
<text x="40" y="46" fill="#e8eaed" font-size="25" font-weight="650">Journeyman</text>
<text x="230" y="46" fill="#9aa3ae" font-size="15">an AI engineer, as a cyclic Strands agent graph</text>
<line x1="40" y1="64" x2="1160" y2="64" stroke="#232830"/>

<g font-size="13.5" font-weight="600" text-anchor="middle">
<rect x="40" y="100" width="128" height="64" rx="9" fill="#14171c" stroke="#2e3540"/>
<text x="104" y="126" fill="#e8eaed">intake</text><text x="104" y="146" fill="#6b7480" font-size="11" font-weight="400">goal, and what exists</text>

<rect x="196" y="100" width="150" height="64" rx="9" fill="#14171c" stroke="#2e3540"/>
<text x="271" y="122" fill="#e8eaed">architect</text><text x="271" y="140" fill="#6b7480" font-size="11" font-weight="400">picks the pattern</text><text x="271" y="155" fill="#6b7480" font-size="11" font-weight="400">names the rejections</text>

<rect x="374" y="100" width="136" height="64" rx="9" fill="#14171c" stroke="#2e3540"/>
<text x="442" y="122" fill="#e8eaed">recall</text><text x="442" y="140" fill="#6b7480" font-size="11" font-weight="400">prior jobs like this</text><text x="442" y="155" fill="#6b7480" font-size="11" font-weight="400">what worked then</text>

<rect x="538" y="100" width="146" height="64" rx="9" fill="#14171c" stroke="#2e3540"/>
<text x="611" y="122" fill="#e8eaed">harness</text><text x="611" y="140" fill="#6b7480" font-size="11" font-weight="400">builds the eval set</text><text x="611" y="155" fill="#6b7480" font-size="11" font-weight="400">splits off held-out</text>

<rect x="712" y="100" width="146" height="64" rx="9" fill="#14171c" stroke="#2e3540"/>
<text x="785" y="122" fill="#e8eaed">prove</text><text x="785" y="140" fill="#6b7480" font-size="11" font-weight="400">baseline score</text><text x="785" y="155" fill="#6b7480" font-size="11" font-weight="400">failure clusters</text>
</g>
<g stroke="#8b95a3" stroke-width="1.6" marker-end="url(#a)">
<line x1="168" y1="132" x2="190" y2="132"/><line x1="346" y1="132" x2="368" y2="132"/>
<line x1="510" y1="132" x2="532" y2="132"/><line x1="684" y1="132" x2="706" y2="132"/>
</g>
<path d="M858,132 L940,132 L940,222" fill="none" stroke="#8b95a3" stroke-width="1.6" marker-end="url(#a)"/>

<!-- the cycle -->
<rect x="560" y="222" width="300" height="112" rx="10" fill="#101a14" stroke="#27543c" stroke-width="1.6"/>
<text x="710" y="250" fill="#3ddc97" font-size="14" font-weight="650" text-anchor="middle">evolve</text>
<text x="710" y="272" fill="#9aa3ae" font-size="11.5" text-anchor="middle">target the worst failure cluster</text>
<text x="710" y="290" fill="#9aa3ae" font-size="11.5" text-anchor="middle">mutate, measure on train only</text>
<text x="710" y="308" fill="#9aa3ae" font-size="11.5" text-anchor="middle">recalled repairs tried first, still scored</text>
<text x="710" y="326" fill="#6b7480" font-size="11" text-anchor="middle">ONE EXECUTION = ONE GENERATION</text>

<rect x="920" y="238" width="176" height="80" rx="10" fill="#2a2418" stroke="#ffc857" stroke-width="1.6"/>
<text x="1008" y="264" fill="#ffc857" font-size="14" font-weight="650" text-anchor="middle">select</text>
<text x="1008" y="284" fill="#c9a24a" font-size="11" text-anchor="middle">CONDITIONAL EDGE</text>
<text x="1008" y="301" fill="#c9a24a" font-size="11" text-anchor="middle">keep going, or stop</text>

<line x1="860" y1="278" x2="914" y2="278" stroke="#8b95a3" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1008,318 L1008,368 L710,368 L710,340" fill="none" stroke="#3ddc97" stroke-width="2.2" marker-end="url(#ag)"/>
<text x="860" y="388" fill="#3ddc97" font-size="12" font-weight="600" text-anchor="middle">still improving: go round again (a real cycle in the graph)</text>

<path d="M1008,238 L1008,200 L520,200 L520,430" fill="none" stroke="#ffc857" stroke-width="1.8" marker-end="url(#ay)"/>
<text x="640" y="194" fill="#ffc857" font-size="12" font-weight="600" text-anchor="middle">converged</text>

<rect x="380" y="430" width="280" height="96" rx="10" fill="#2a2418" stroke="#5a4a22" stroke-width="1.5"/>
<text x="520" y="456" fill="#ffc857" font-size="14" font-weight="650" text-anchor="middle">gate</text>
<text x="520" y="477" fill="#9aa3ae" font-size="11.5" text-anchor="middle">first and only read of the held-out half</text>
<text x="520" y="495" fill="#9aa3ae" font-size="11.5" text-anchor="middle">ships what survives, not the best train score</text>
<text x="520" y="513" fill="#9aa3ae" font-size="11.5" text-anchor="middle">overfit or no-gain reported as such</text>

<line x1="520" y1="526" x2="520" y2="562" stroke="#8b95a3" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="330" y="562" width="380" height="72" rx="10" fill="#171b21" stroke="#3ddc97"/>
<text x="520" y="588" fill="#3ddc97" font-size="13.5" font-weight="600" text-anchor="middle">ship</text>
<text x="520" y="608" fill="#9aa3ae" font-size="11.5" text-anchor="middle">the artifact, its eval set, a CI regression gate</text>
<text x="520" y="625" fill="#6b7480" font-size="11" text-anchor="middle">and the lessons, written to memory</text>

<!-- memory -->
<rect x="40" y="222" width="230" height="150" rx="10" fill="#14171c" stroke="#232830"/>
<text x="58" y="248" fill="#6b7480" font-size="10.5" letter-spacing="1.4">MEMORY</text>
<text x="58" y="274" fill="#9aa3ae" font-size="11.5">task fingerprint</text>
<text x="58" y="293" fill="#9aa3ae" font-size="11.5">patterns chosen</text>
<text x="58" y="312" fill="#9aa3ae" font-size="11.5">which repair fixed which failure</text>
<text x="58" y="331" fill="#9aa3ae" font-size="11.5">gain, per lesson</text>
<text x="58" y="356" fill="#3ddc97" font-size="11.5">9 candidates -&gt; 3 on the next job</text>
<path d="M270,290 L340,290 L340,132 L368,132" fill="none" stroke="#3ddc97" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M700,634 L180,634 L180,372" fill="none" stroke="#3ddc97" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ag)"/>

<!-- patterns -->
<rect x="40" y="430" width="300" height="150" rx="10" fill="#14171c" stroke="#232830"/>
<text x="58" y="456" fill="#6b7480" font-size="10.5" letter-spacing="1.4">PATTERN LIBRARY (12)</text>
<text x="58" y="480" fill="#9aa3ae" font-size="11">structured extraction · tool use · RAG hybrid</text>
<text x="58" y="498" fill="#9aa3ae" font-size="11">planning · workflow graph · evolution loop</text>
<text x="58" y="516" fill="#9aa3ae" font-size="11">verification · memory · swarm · HITL</text>
<text x="58" y="534" fill="#9aa3ae" font-size="11">causal decision · direct call</text>
<text x="58" y="558" fill="#6b7480" font-size="10.5">each carries when NOT to use it, and</text>
<text x="58" y="572" fill="#6b7480" font-size="10.5">what it needs before it is even available</text>

<line x1="40" y1="652" x2="1160" y2="652" stroke="#232830"/>
<text x="760" y="672" fill="#6b7480" font-size="11.5" text-anchor="end">Every node is deterministic Python. Nothing is graded by a language model, and the held-out score is the one reported.</text>
</svg>
